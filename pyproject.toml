[project]
name = "rag-eval"
version = "0.1.0"
description = "A local RAG system with source citations and an evaluation suite"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastembed>=0.9.1",
    "lancedb>=0.40.0",
    "pydantic>=2.14.1",
    "pypdf>=6.21.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_eval"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.3",
]
